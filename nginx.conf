# Configuração do Nginx para o site Controle de Finanças & Compras
# Localização recomendada no servidor VM: /etc/nginx/sites-available/controle-financas
# Lembre-se de criar o link simbólico para habilitar:
# sudo ln -s /etc/nginx/sites-available/controle-financas /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;

    # Altere para o seu domínio ou subdomínio registrado (ex: financas.seudominio.com)
    server_name localhost financas.seudominio.com;

    # Diretório raiz onde os arquivos compilados do Vue.js estarão hospedados
    root /var/www/controle-financas/html;
    index index.html;

    # Configuração de Logs
    access_log /var/log/nginx/financas_access.log;
    error_log /var/log/nginx/financas_error.log warn;

    # Configuração de charset
    charset utf-8;

    # Cabeçalhos de Segurança Recomendados
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rota Principal - Roteamento Vue Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para o Backend Node.js executando localmente na porta 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Headers adicionais para passar IP real do cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de Alta Performance para Arquivos de Mídia e Imagens (30 dias)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Cache para CSS e JS (7 dias)
    location ~* \.(?:css|js)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Compressão Gzip (Otimiza muito a velocidade de carregamento)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Configuração de Página de Erro Personalizada
    error_page 404 /index.html;
    
    # Prevenção de acesso a arquivos ocultos (ex: .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
