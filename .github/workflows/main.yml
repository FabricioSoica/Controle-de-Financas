name: Deploy pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} 

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navega até a pasta do projeto
            cd /var/www/html/controle-financas

            # Atualiza e força a sincronização exata com o repositório no GitHub
            git fetch origin main
            git reset --hard origin/main

            # Atualiza e reinicia o Backend
            cd backend
            npm install --production
            
            # Reinicia o processo correto no PM2 (financas-api rodando server.js)
            pm2 restart financas-api || pm2 start server.js --name "financas-api"

            # Atualiza e compila o Frontend no servidor
            cd ../frontend
            npm install
            npm run build

      - name: Discord Notification on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "🚀 Deploy Realizado com Sucesso!",
                   "description": "O deploy do **Controle de Finanças** foi concluído com sucesso na VM!",
                   "color": 3066993,
                   "fields": [
                     { "name": "Repositório", "value": "${{ github.repository }}", "inline": true },
                     { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                     { "name": "Commit", "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": false }
                   ],
                   "footer": { "text": "GitHub Actions Pipeline" }
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "❌ Falha no Deploy!",
                   "description": "Ocorreu um erro durante a execução da pipeline de deploy do **Controle de Finanças**.",
                   "color": 15158332,
                   "fields": [
                     { "name": "Repositório", "value": "${{ github.repository }}", "inline": true },
                     { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                     { "name": "Commit", "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": false },
                     { "name": "Workflow Run", "value": "[Visualizar Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false }
                   ],
                   "footer": { "text": "GitHub Actions Pipeline" }
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}
