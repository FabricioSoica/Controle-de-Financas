name: Deploy pipeline

on:
  push:
    branches:
      - main # Executa o deploy sempre que houver push na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia o código do repositório para a máquina virtual do GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura a versão correta do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 3. Faz o build do Frontend (Vue.js) para garantir que não há erros de compilação
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          # Insira aqui variáveis de ambiente necessárias para o build do frontend, se houver
          VITE_API_URL: ${{ secrets.VITE_API_URL }} 

      # 4. Conecta ao servidor via SSH e executa os comandos de atualização
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navega até a pasta do projeto no servidor
            cd /caminho/para/o/seu/projeto/no/servidor

            # Atualiza o código com a versão mais recente do GitHub
            git pull origin main

            # Atualiza e reinicia o Backend
            cd backend
            npm install --production
            # Reinicia a aplicação usando o PM2 (ajuste o nome 'backend-app' para o seu caso)
            pm2 restart backend-app || pm2 start dist/main.js --name "backend-app"

            # Atualiza o Frontend
            cd ../frontend
            npm install
            npm run build
            
            # Se você usa Nginx para servir o build estático do frontend, 
            # garanta que a pasta dist gerada esteja no diretório apontado pelo Nginx (ex: /var/www/html)
            # cp -r dist/* /var/www/html/
